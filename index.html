<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DishSushi — Luxury Japanese Cuisine & Omakase Dining</title>

    <!-- Google Fonts: Cormorant Garamond (Luxury Serif), Great Vibes (Cursive Calligraphy), Plus Jakarta Sans (Clean Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Tailwind Configuration for Luxury Gold & Obsidian Black Palette -->
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: {
              serif: ['"Cormorant Garamond"', '"Playfair Display"', "serif"],
              display: ['"Playfair Display"', "serif"],
              cursive: ['"Great Vibes"', "cursive"],
              sans: ['"Plus Jakarta Sans"', "sans-serif"],
            },
            colors: {
              gold: {
                100: "#fef9c3",
                200: "#fef08a",
                300: "#fde047",
                400: "#eab308",
                500: "#d4af37",
                600: "#c59b27",
                700: "#a17c1d",
                800: "#854d0e",
                900: "#713f12",
              },
              dark: {
                bg: "#0a0a0a",
                card: "#121212",
                surface: "#181818",
                border: "#2a2a2a",
                "gold-border": "rgba(212, 175, 55, 0.35)",
                muted: "#8e8e8e",
              },
            },
            boxShadow: {
              "gold-glow": "0 0 35px -5px rgba(212, 175, 55, 0.25)",
              "gold-card":
                "0 10px 30px -10px rgba(0, 0, 0, 0.8), 0 0 1px 1px rgba(212, 175, 55, 0.15)",
            },
          },
        },
      };
    </script>

    <link rel="stylesheet" href="./css/custom.css" />
  </head>
  <body
    class="bg-[#0a0a0a] text-gray-200 font-sans antialiased selection:bg-gold-500 selection:text-black min-h-screen relative overflow-x-hidden"
  >
    <!-- Ambient Luxury Gold Fog / Grain Overlay -->
    <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
      <div
        class="absolute -top-40 left-1/2 -translate-x-1/2 w-[800px] h-[500px] bg-gold-500/5 rounded-full blur-[160px]"
      ></div>
      <div
        class="absolute top-[40%] -left-40 w-[600px] h-[600px] bg-amber-600/5 rounded-full blur-[180px]"
      ></div>
      <div
        class="absolute top-[75%] -right-40 w-[600px] h-[600px] bg-gold-500/5 rounded-full blur-[180px]"
      ></div>
    </div>

    <!-- Dynamic Application Root Mounted via JavaScript DOM -->
    <div id="app" class="relative z-10 flex flex-col min-h-screen"></div>

    <!-- Application Scripts -->
    <script src="./js/data.js"></script>
    <script src="./js/main.js"></script>
  </body>
</html>
